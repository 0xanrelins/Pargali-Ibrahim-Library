# Phase 3 alerting — configurable thresholds for Grafana alert rules.
# Consumed by monitoring/grafana/provisioning/alerting/ (Adım 9.2).

defaults:
  evaluation_interval: 1m
  pending_period: 5m
  keep_firing_for: 0s

alerts:
  stream_unrepairable:
    enabled: true
    severity: critical
    description: UBWA reported a stream that cannot be repaired automatically.
    pending_period: 0s
    query_window: 5m
    min_increase: 1

  collector_disconnected:
    enabled: true
    severity: critical
    description: Collector Prometheus exporter is down or unreachable.
    pending_period: 2m
    up_value: 1

  normalizer_disconnected:
    enabled: true
    severity: critical
    description: Normalizer Prometheus exporter is down or unreachable.
    pending_period: 2m
    up_value: 1

  orderbook_collector_disconnected:
    enabled: true
    severity: critical
    description: Orderbook collector Prometheus exporter is down or unreachable.
    pending_period: 2m
    up_value: 1

  polymarket_collector_disconnected:
    enabled: true
    severity: critical
    description: Polymarket collector Prometheus exporter is down or unreachable.
    pending_period: 2m
    up_value: 1

  buffer_near_capacity:
    enabled: true
    severity: warning
    description: UBWA stream buffer is approaching its maximum capacity.
    pending_period: 5m
    capacity_ratio: 0.85

  parquet_conversion_failed:
    enabled: true
    severity: warning
    description: Normalizer parquet batch write failed in the last evaluation window.
    pending_period: 0s
    query_window: 15m
    min_increase: 1

  disk_usage_high:
    enabled: true
    severity: warning
    description: Disk usage on the data volume exceeded the configured threshold.
    pending_period: 5m
    used_percent: 85

  disk_usage_critical:
    enabled: true
    severity: critical
    description: Disk usage on the data volume is critically high.
    pending_period: 2m
    used_percent: 95

notification:
  # Provisioned in monitoring/grafana/provisioning/alerting/contact-points.yaml
  default_contact_point: mdp-alerts
  webhook_contact_point: mdp-alerts-webhook
  group_by:
    - alertname
    - severity
