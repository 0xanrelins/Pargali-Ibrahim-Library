# Phase 3 — notification routing (Adım 9.3)
# Thresholds/grouping mirror monitoring/alerts/config.yaml notification section.
apiVersion: 1

policies:
  - orgId: 1
    receiver: mdp-alerts
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: mdp-alerts
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 2h
        continue: false
      - receiver: mdp-alerts
        matchers:
          - severity = warning
        group_wait: 30s
        repeat_interval: 4h
        continue: false
