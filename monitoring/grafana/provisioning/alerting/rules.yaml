# Phase 3 — Grafana-managed alert rules (Adım 9.2)
# Thresholds mirror monitoring/alerts/config.yaml
apiVersion: 1

groups:
  - orgId: 1
    name: mdp-alerts
    folder: Market Data Platform
    interval: 1m
    rules:
      - uid: mdp-stream-unrepairable
        title: MDP Stream Unrepairable
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(increase(mdp_ubwa_stream_signal_total{signal="STREAM_UNREPAIRABLE"}[5m]))
              instant: false
              range: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B >= 1
              refId: C
              type: math
        noDataState: OK
        execErrState: Alerting
        for: 0s
        labels:
          alertname: stream_unrepairable
          severity: critical
        annotations:
          summary: UBWA reported a stream that cannot be repaired automatically
          description: STREAM_UNREPAIRABLE signal increased in the last 5 minutes.

      - uid: mdp-collector-down
        title: MDP Collector Disconnected
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: mdp_up{service="market-data-platform-collector"}
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B < 1
              refId: C
              type: math
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        labels:
          alertname: collector_disconnected
          severity: critical
        annotations:
          summary: Collector Prometheus exporter is down or unreachable
          description: mdp_up for market-data-platform-collector is below 1.

