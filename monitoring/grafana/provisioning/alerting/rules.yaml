          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                (mdp_ubwa_stream_buffer_maxlen > 0)
                and (mdp_ubwa_stream_buffer_length / mdp_ubwa_stream_buffer_maxlen > 0.85)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
