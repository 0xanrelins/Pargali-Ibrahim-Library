      - uid: mdp-buffer-capacity
        title: MDP Buffer Near Capacity
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                (mdp_ubwa_stream_buffer_maxlen > 0)
                and (mdp_ubwa_stream_buffer_length / mdp_ubwa_stream_buffer_maxlen > 0.85)
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 0
              refId: C
              type: math
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          alertname: buffer_near_capacity
          severity: warning
        annotations:
          summary: UBWA stream buffer is approaching maximum capacity
          description: Buffer fill ratio exceeded 85% for one or more streams.

      - uid: mdp-parquet-failed
        title: MDP Parquet Conversion Failed
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(increase(mdp_pipeline_parquet_failed_conversions_total[15m]))
              instant: false
              range: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B >= 1
              refId: C
              type: math
        noDataState: OK
        execErrState: Alerting
        for: 0s
        labels:
          alertname: parquet_conversion_failed
          severity: warning
        annotations:
          summary: Parquet conversion failed in the last 15 minutes
          description: mdp_pipeline_parquet_failed_conversions_total increased.

      - uid: mdp-disk-high
        title: MDP Disk Usage High
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: mdp_storage_used_percent > 85
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 0
              refId: C
              type: math
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          alertname: disk_usage_high
          severity: warning
        annotations:
          summary: Disk usage on the data volume exceeded 85%
          description: mdp_storage_used_percent is above the warning threshold.

      - uid: mdp-disk-critical
        title: MDP Disk Usage Critical
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
