          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: (time() - mdp_pipeline_catalog_last_sync_timestamp_seconds) > 900
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 0
              refId: C
              type: math
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        labels:
          alertname: catalog_sync_stale
          severity: warning
        annotations:
          summary: Metadata catalog has not synced recently
          description: Last catalog sync is older than 15 minutes.

