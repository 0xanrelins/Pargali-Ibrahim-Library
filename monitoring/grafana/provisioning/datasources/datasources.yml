apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  # In-memory DuckDB; query parquet via read_parquet('/data/...') in panel SQL.
  - name: DuckDB
    uid: duckdb
    type: motherduck-duckdb-datasource
    access: proxy
    editable: true
    jsonData:
      path: ""
      initSql: ""
